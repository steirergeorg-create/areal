<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>a-real Immobilien</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Georgia', serif;
      background-color: #0d1b2a;
      color: #f0ece4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .container {
      max-width: 680px;
    }

    .logo {
      font-size: 3.2rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #c9a96e;
      margin-bottom: 0.3rem;
      text-transform: uppercase;
    }

    .logo span {
      color: #f0ece4;
    }

    .tagline {
      font-size: 0.85rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #7a8fa6;
      margin-bottom: 3rem;
    }

    .divider {
      width: 60px;
      height: 2px;
      background: #c9a96e;
      margin: 0 auto 3rem;
    }

    .headline {
      font-size: 1.6rem;
      font-weight: 400;
      line-height: 1.6;
      color: #f0ece4;
      margin-bottom: 1.2rem;
    }

    .sub {
      font-size: 1rem;
      color: #7a8fa6;
      line-height: 1.8;
      font-family: 'Arial', sans-serif;
    }

    .contact {
      margin-top: 3.5rem;
      font-size: 0.85rem;
      color: #7a8fa6;
      font-family: 'Arial', sans-serif;
      letter-spacing: 0.05em;
    }

    .contact a {
      color: #c9a96e;
      text-decoration: none;
    }

    .contact a:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: 5rem;
      font-size: 0.75rem;
      color: #3a4a5a;
      font-family: 'Arial', sans-serif;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">a<span>-</span>real</div>
    <div class="tagline">Immobilien &middot; Österreich</div>
    <div class="divider"></div>
    <h1 class="headline">Hier entsteht bald etwas Großes.</h1>
    <p class="sub">
      Wir arbeiten mit Hochdruck an unserer neuen Website.<br />
      Freuen Sie sich auf ein besonderes Immobilienerlebnis.
    </p>
    <div class="contact">
      Fragen? &nbsp;<a href="mailto:office@a-real.at">office@a-real.at</a>
    </div>
  </div>
  <footer>&copy; 2026 a-real Immobilien &mdash; Wien, Österreich</footer>
</body>
</html>
